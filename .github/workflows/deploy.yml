name: Verify and deploy SEO pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/catalog.json'
      - 'src/catalog-external.json'
      - 'src/catalog-extra.json'
      - 'src/freshness.json'
      - 'data/discovery-queue.json'
      - 'data/discovery-health.json'
  pull_request:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: npm run verify
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.event_name != 'pull_request'
        with:
          path: dist
      - name: Freshness summary
        if: always()
        run: |
          if test -f src/freshness.json; then
            echo '## Last successful catalog check' >> "$GITHUB_STEP_SUMMARY"
            cat src/freshness.json >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Source failures preserve the last known metadata and success timestamps; partial failures are reported. Validation failures block deployment. Browsers use the latest public catalog JSON and fall back to the embedded snapshot if it is unavailable.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
  readback:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/readback.mjs
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.sha }}
