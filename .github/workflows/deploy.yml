name: Verify and deploy SEO pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/catalog.json'
      - 'src/catalog-external.json'
      - 'src/catalog-extra.json'
      - 'src/freshness.json'
      - 'data/discovery-queue.json'
      - 'data/discovery-health.json'
  pull_request:
  workflow_run:
    workflows: [Refresh live catalog]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: npm run verify
      - run: python3 scripts/quota_guard.py
      - name: Check artifact storage before upload
        if: github.event_name != 'pull_request'
        run: python3 scripts/quota_guard.py --remote
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist
          retention-days: 1
      - name: Freshness summary
        if: always()
        run: |
          if test -f src/freshness.json; then
            echo '## Last successful catalog check' >> "$GITHUB_STEP_SUMMARY"
            cat src/freshness.json >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Source failures preserve the last known metadata and success timestamps; partial failures are reported. Validation failures block deployment. Browsers use the latest public catalog JSON and fall back to the embedded snapshot if it is unavailable.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
  readback:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: node scripts/readback.mjs
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.sha }}
