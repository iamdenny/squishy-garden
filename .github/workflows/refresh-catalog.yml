name: Refresh live catalog
on:
  schedule:
    - cron: '23 21 * * *'
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Collect and validate latest catalog metadata
        run: |
          python3 scripts/collect.py
          python3 scripts/discover.py
          python3 -m unittest discover -s tests -p '*_test.py'
          npm run verify
      - name: Commit validated catalog snapshot
        run: |
          git config user.name 'Denny Lim'
          git config user.email 'hi.iamdenny@gmail.com'
          git add public/catalog.json src/catalog-external.json src/catalog-extra.json src/freshness.json data/discovery-queue.json data/discovery-health.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh verified pattern catalog'
            git push origin HEAD:main
          fi
      - name: Summarize current catalog check
        if: always()
        run: |
          if test -f src/freshness.json; then
            echo '## Last successful catalog check' >> "$GITHUB_STEP_SUMMARY"
            cat src/freshness.json >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Validated catalog snapshots update the public JSON read directly by browsers without a Pages rebuild. Static detail pages and the sitemap deploy after each successful refresh.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fail visibly when collection is unhealthy
        run: python3 scripts/check_freshness.py
